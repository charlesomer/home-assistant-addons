description: Shairport Sync add-on. AirPlay 2 audio player.
name: Shairport Sync
version: "0.0.20"
slug: shairport-sync
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
url: "https://github.com/charlesomer/home-assistant-addons/tree/main/shairport-sync"
host_network: true
map:
  - type: addon_config
    path: /addon_config
image: ghcr.io/charlesomer/ha-addon-shairport-sync-{arch}

devices:
  - /dev/snd:/dev/snd

privileged:
  - SYS_NICE

options:
  configfile: "/addon_config/shairport-sync.conf"
  help: false

schema:
  configfile: "str?"
  help: "bool?"